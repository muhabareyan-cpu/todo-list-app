<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">✓ TodoMaster</h1>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">
                    <span class="theme-icon">🌙</span>
                </button>
                <button class="export-btn" id="exportBtn" title="Export Tasks">
                    <span>📥</span> Export
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="stats-card">
                <h3>📊 Stats</h3>
                <div class="stat-item">
                    <span class="stat-label">Total Tasks</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value completed" id="completedTasks">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value pending" id="pendingTasks">0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
            </div>

            <div class="categories-card">
                <h3>📁 Categories</h3>
                <button class="category-btn active" data-category="all">
                    All Tasks <span class="count">0</span>
                </button>
                <button class="category-btn" data-category="work">
                    💼 Work <span class="count">0</span>
                </button>
                <button class="category-btn" data-category="personal">
                    👤 Personal <span class="count">0</span>
                </button>
                <button class="category-btn" data-category="shopping">
                    🛒 Shopping <span class="count">0</span>
                </button>
                <button class="category-btn" data-category="health">
                    💪 Health <span class="count">0</span>
                </button>
            </div>

            <div class="actions-card">
                <h3>⚙️ Actions</h3>
                <button class="action-btn clear-completed" id="clearCompletedBtn">
                    Clear Completed
                </button>
                <button class="action-btn clear-all" id="clearAllBtn">
                    Clear All
                </button>
            </div>
        </aside>

        <!-- Main Panel -->
        <section class="main-panel">
            
            <!-- Search & Filter -->
            <div class="controls">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="🔍 Search tasks..."
                        class="search-input"
                    >
                </div>
                <div class="sort-box">
                    <select id="sortSelect" class="sort-select">
                        <option value="date-desc">Newest First</option>
                        <option value="date-asc">Oldest First</option>
                        <option value="priority">Priority</option>
                        <option value="completed">Completed</option>
                        <option value="title">Title (A-Z)</option>
                    </select>
                </div>
            </div>

            <!-- Add Task Form -->
            <div class="add-task-form">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Add a new task..." 
                    class="task-input"
                    autocomplete="off"
                >
                
                <div class="form-controls">
                    <div class="form-group">
                        <select id="categorySelect" class="form-select">
                            <option value="personal">👤 Personal</option>
                            <option value="work">💼 Work</option>
                            <option value="shopping">🛒 Shopping</option>
                            <option value="health">💪 Health</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <select id="prioritySelect" class="form-select">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <input 
                            type="date" 
                            id="dueDateInput" 
                            class="form-input"
                        >
                    </div>

                    <button class="add-btn" id="addBtn">Add Task</button>
                </div>
            </div>

            <!-- Tasks List -->
            <div class="tasks-container">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📝</div>
                    <p>No tasks yet. Add one to get started!</p>
                </div>
                <div class="tasks-list" id="tasksList"></div>
            </div>

        </section>

    </main>

</div>

<!-- Toast Notification -->
<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
